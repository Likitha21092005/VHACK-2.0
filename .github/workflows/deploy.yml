name: Deploy GuardianAI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check website files
        run: |
          echo "Repository:"
          pwd

          echo "Root files:"
          ls -la

          echo "GuardianAI folder:"
          ls -la guardianai

          echo "Dist folder:"
          ls -la guardianai/dist

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/guardianai/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
